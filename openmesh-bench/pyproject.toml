[project]
name = "openmesh-bench"
version = "0.0.1"
description = "Thin OpenAI-compatible client + trace layer for running GAIA / tau-bench / SWE-bench Pro through OpenMesh."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
]

[project.scripts]
openmesh-smoke = "openmesh_bench.smoke:main"
openmesh-upload = "openmesh_bench.uploader:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmesh_bench*"]
