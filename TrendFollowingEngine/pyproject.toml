[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-engine"
version = "0.1.0"
description = "Daily large-cap outsized-move scanner with revaluation-vs-pulse predictor."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TrendFollowingEngine contributors" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.3",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
text = [
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "anthropic>=0.39",
]
hf = [
    "transformers>=4.41",
    "torch>=2.2",
]
full = [
    "trend-engine[text,hf]",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
trend-engine = "trend_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
